repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # versioneer's generated file and scratch notebooks are not linted
      - id: ruff
        args: [--fix]
        exclude: '(_version\.py|\.ipynb)$'
      - id: ruff-format
        exclude: '(_version\.py|\.ipynb)$'
