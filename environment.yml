# Derived from pyproject.toml — keep in sync. uv is the default runner;
# this file is for conda/micromamba users.
name: launchcontainers
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - "nilearn>=0.10.4"
      - "matplotlib"
      - "bokeh>=2.4.2"
      - "bids"
      - "ipython>=7.29.0"
      - "pybids>=0.16.1,<0.17"
      - "nibabel"
      - "numpy>=2.0"
      - "pandas>=2.1"
      - "scipy"
      - "PyYAML"
      - "requests>=2.26,<3.0"
      - "heudiconv>=1.3.2"
      - "setuptools>=67.0.0,<68"
      - "typer>=0.15.3"
      - "openpyxl>=3.1.5"
      - "h5py>=3.0"
      - "rich>=13.0"
      - "tqdm"
      - "tedana==26.0.3"
      - -e .
