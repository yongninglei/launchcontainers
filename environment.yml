# Derived from pyproject.toml — keep in sync. uv is the default runner;
# this file is for conda/micromamba users. Core only; add extras on the
# `-e .` line, e.g.  -e ".[dwi]"  (see requirements.txt for the list).
name: launchcontainers
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pyyaml>=6.0
  - rich>=13.0
  - typer>=0.15.3
  - pip
  - pip:
      - -e .
