[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchcontainers"
version = "0.5.0"
description = "A Python based soft to launch neuroimaging containers on clusters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Garikoitz Lerma-Usabiaga" },
    { name = "Leandro Lecca" },
    { name = "Mengxing Liu" },
    { name = "Yongning Lei", email = "t.lei@bcbl.eu" },
]
# Acknowledgments
# We would like to thank Iñigo Tellaetxe from CompNeuroLabBilbao for his help on packaging this repository
# We would also like to thank Qian Chu from MPIEA for his help on setting up sphinx and github workflow for this repository
maintainers = [
    { name = "Garikoitz Lerma-Usabiaga" },
    { name = "Yongning Lei", email = "t.lei@bcbl.eu" },
]
keywords = ["HPC", "MRI", "nilearn", "RTP2", "DWI", "dMRI", "fMRI", "fMRIprep", "PRF"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The core (lc, launchcontainers.core, lc-session) needs only these three.
# Everything heavy is an extra. The analyses lc runs (pyGLM, autoROI, …) live
# in their own environments; lc calls their programs and never imports them.
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.15.3",
]

[project.urls]
Repository = "https://github.com/garikoitz/launchcontainers"

[project.optional-dependencies]
# DWI container tools (anatrois, freesurferator, rtp*-preproc, rtp*-pipeline): staging
dwi = ["pybids>=0.16.1,<0.17", "nibabel", "numpy>=2.0", "pandas>=2.1"]
# l1_surface GLM *input* preparation (prepare/glm_prepare.py, prf_prepare.py)
fmri = ["pybids>=0.16.1,<0.17", "nibabel", "numpy>=2.0", "pandas>=2.1", "scipy"]
# `checker` (analysis_checker)
checker = ["h5py>=3.0", "pandas>=2.1", "scipy", "nibabel", "numpy>=2.0"]
# heudiconv-based helpers (helper_function/create_bids.py)
heudiconv = ["heudiconv>=1.3.2"]
# Study scripts in launchcontainers/tests/ and MR_pipelines/ (not part of the package)
scripts = [
    # first_level_from_bids(sub_labels=...) needs nilearn>=0.10.1
    "nilearn>=0.10.4",
    "matplotlib",
    "bokeh>=2.4.2",
    "bids",
    "ipython>=7.29.0",
    "pybids>=0.16.1,<0.17",
    "nibabel",
    # tedana 26.0.3 requires numpy >=1.26.0; GLM scripts use np.trapezoid (numpy>=2.0)
    "numpy>=2.0",
    # GLM scripts use DataFrame.map (pandas>=2.1); applymap is gone in pandas 3
    "pandas>=2.1",
    "scipy",
    "requests>=2.26,<3.0",
    "openpyxl>=3.1.5",
    "h5py>=3.0",
    "tqdm",
    "tedana==26.0.3",
]
# Everything
all = ["launchcontainers[dwi,fmri,checker,heudiconv,scripts]"]

[project.scripts]
# the main function
lc = "launchcontainers.cli:main"
# one session's command, recorded (lc run wraps every job line in it)
lc-session = "launchcontainers.core.session:app"
checker = "analysis_checker.check_analysis_integrity:main"

# Tools lc can launch. lc's own (DWI containers, pyGLM, autoROI-*) are built
# in (tools/__init__.py); other packages may add theirs to the same group.
[project.entry-points."launchcontainers.tools"]
anatrois = "launchcontainers.tools.dwi:ANATROIS"
freesurferator = "launchcontainers.tools.dwi:FREESURFERATOR"
rtppreproc = "launchcontainers.tools.dwi:RTPPREPROC"
rtp2-preproc = "launchcontainers.tools.dwi:RTP2_PREPROC"
rtp-pipeline = "launchcontainers.tools.dwi:RTP_PIPELINE"
rtp2-pipeline = "launchcontainers.tools.dwi:RTP2_PIPELINE"

[dependency-groups]
dev = [
    "types-PyYAML",
    # Testing
    "pytest",
    "pytest-cov",
    "coverage-conditional-plugin>=0.7.0,<0.8",
    # Linting
    "flake8",
    "flake8-bugbear",
    "flake8-broken-line",
    "flake8-comprehensions",
    # Formatting
    "black>=23.1a1",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton",
    "nbsphinx",
    "myst-parser",
]

[tool.uv]
default-groups = ["dev"]
# The .venv is shared by brodmann (Rocky 8, glibc 2.28) and the ips SGE nodes
# (CentOS 7, glibc 2.17). Use uv's own Python, which runs on both, rather than
# brodmann's system python3.11, which does not run on CentOS 7.
python-preference = "only-managed"
# Cap compiled packages at the last releases with manylinux2014 (glibc 2.17)
# wheels. Newer releases ship glibc>=2.28 wheels only, so on the ips nodes uv
# falls back to a source build, which CentOS 7's gcc cannot compile.
# Checked with: uv pip compile --python-platform x86_64-manylinux_2_17
constraint-dependencies = [
    "numpy<2.3",
    "scipy<1.17",
    "pandas<2.3.3",
    "pillow<12.3",
    "contourpy<1.3.3",
    "h5py<3.15",
    "scikit-learn<1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/launchcontainers", "src/analysis_checker"]
