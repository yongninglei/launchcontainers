[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchcontainers"
version = "0.4.8"
description = "A Python based soft to launch neuroimaging containers on clusters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Garikoitz Lerma-Usabiaga" },
    { name = "Leandro Lecca" },
    { name = "Mengxing Liu" },
    { name = "Yongning Lei", email = "t.lei@bcbl.eu" },
]
# Acknowledgments
# We would like to thank Iñigo Tellaetxe from CompNeuroLabBilbao for his help on packaging this repository
# We would also like to thank Qian Chu from MPIEA for his help on setting up sphinx and github workflow for this repository
maintainers = [
    { name = "Garikoitz Lerma-Usabiaga" },
    { name = "Yongning Lei", email = "t.lei@bcbl.eu" },
]
keywords = ["HPC", "MRI", "nilearn", "RTP2", "DWI", "dMRI", "fMRI", "fMRIprep", "PRF"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # first_level_from_bids(sub_labels=...) needs nilearn>=0.10.1
    "nilearn>=0.10.4",
    "matplotlib",
    "bokeh>=2.4.2",
    "bids",
    "ipython>=7.29.0",
    "pybids>=0.16.1,<0.17",
    "nibabel",
    # tedana 26.0.3 requires numpy >=1.26.0; GLM scripts use np.trapezoid (numpy>=2.0)
    "numpy>=2.0",
    # GLM scripts use DataFrame.map (pandas>=2.1); applymap is gone in pandas 3
    "pandas>=2.1",
    "scipy",
    "PyYAML",
    "requests>=2.26,<3.0",
    "heudiconv>=1.3.2",
    # utils.py imports pkg_resources, which setuptools>=81 removed
    "setuptools>=67.0.0,<68",
    "typer>=0.15.3",
    "openpyxl>=3.1.5",
    "h5py>=3.0",
    "rich>=13.0",
    "tqdm",
    "tedana==26.0.3",
    "analysis-core>=0.1.3",
]

[project.urls]
Repository = "https://github.com/garikoitz/launchcontainers"

[project.scripts]
# the main function
lc = "launchcontainers.cli:main"
checker = "analysis_checker.check_analysis_integrity:main"

[project.entry-points."analysis_core.tools"]
anatrois = "launchcontainers.tools.dwi:ANATROIS"
freesurferator = "launchcontainers.tools.dwi:FREESURFERATOR"
rtppreproc = "launchcontainers.tools.dwi:RTPPREPROC"
rtp2-preproc = "launchcontainers.tools.dwi:RTP2_PREPROC"
rtp-pipeline = "launchcontainers.tools.dwi:RTP_PIPELINE"
rtp2-pipeline = "launchcontainers.tools.dwi:RTP2_PIPELINE"

[dependency-groups]
dev = [
    "pre-commit",
    "types-PyYAML",
    # Testing
    "pytest",
    "pytest-cov",
    "coverage-conditional-plugin>=0.7.0,<0.8",
    # Linting
    "flake8",
    "flake8-bugbear",
    "flake8-broken-line",
    "flake8-comprehensions",
    # Formatting
    "black>=23.1a1",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton",
    "nbsphinx",
    "myst-parser",
]

[tool.uv.sources]
# local sibling checkout until analysis-core is published
analysis-core = { path = "../analysis-core", editable = true }

[tool.uv]
default-groups = ["dev"]
# The .venv is shared by brodmann (Rocky 8, glibc 2.28) and the ips SGE nodes
# (CentOS 7, glibc 2.17). Use uv's own Python, which runs on both, rather than
# brodmann's system python3.11, which does not run on CentOS 7.
python-preference = "only-managed"
# Cap compiled packages at the last releases with manylinux2014 (glibc 2.17)
# wheels. Newer releases ship glibc>=2.28 wheels only, so on the ips nodes uv
# falls back to a source build, which CentOS 7's gcc cannot compile.
# Checked with: uv pip compile --python-platform x86_64-manylinux_2_17
constraint-dependencies = [
    "numpy<2.3",
    "scipy<1.17",
    "pandas<2.3.3",
    "pillow<12.3",
    "contourpy<1.3.3",
    "h5py<3.15",
    "scikit-learn<1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/launchcontainers", "src/analysis_checker"]
