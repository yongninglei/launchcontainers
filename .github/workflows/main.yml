name: launchcontainers CI

# Tests only. The Sphinx docs job was removed (maintainer, 2026-11-19).
# The workflow is disabled on GitHub (`gh workflow enable main.yml` to turn it on).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        run: uv run pytest -q tests
